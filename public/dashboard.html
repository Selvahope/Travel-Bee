<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="theme-color" content="#1c1405">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css"><title>My trips — TravelBeey</title></head>
<body data-nav="">
<div id="site-header"></div>
<main class="wrap">
  <div class="page-h"><h1 id="hi">My trips</h1><p>Your booking requests and their status.</p></div>
  <div class="dash">
    <nav class="side" aria-label="Account">
      <button class="on" data-tab="trips"></button>
      <button data-tab="profile"></button>
      <a href="/#packages" id="plan"></a>
    </nav>
    <section>
      <div class="tabp on" id="tab-trips"><div id="list"><div class="sk" style="height:120px"></div></div></div>
      <div class="tabp" id="tab-profile">
        <form class="card-p" id="pf" novalidate style="display:grid;gap:14px;max-width:460px">
          <div class="fld"><label for="p-name">Full name</label><input id="p-name" required></div>
          <div class="fld"><label for="p-email">Email</label><input id="p-email" disabled></div>
          <div class="fld"><label for="p-phone">Phone</label><input id="p-phone" type="tel"></div>
          <div class="err" id="p-err" hidden></div>
          <button class="btn btn-primary" type="submit">Save changes</button>
        </form>
      </div>
    </section>
  </div>
</main>
<div id="site-footer"></div>
<script src="/js/site.js"></script>
<script src="/js/dashboard.js"></script>
</body></html>
