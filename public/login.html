<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="theme-color" content="#1c1405">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css"><title>Log in — TravelBeey</title></head>
<body>
<div id="site-header"></div>
<div class="authwrap">
  <div class="auth-side" id="auth-img"><div><img class="auth-logo" src="/img/logo-light.svg" alt="TravelBeey" width="260" height="64"><h2>Your next trip is a few clicks away.</h2>
    <ul><li><svg class="icon" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Track every booking in one place</li><li><svg class="icon" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Book faster with saved details</li><li><svg class="icon" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Cancel a request any time before confirmation</li></ul></div></div>
  <div class="auth-form"><div class="auth-box">
    <h1>Log in</h1><p>Welcome back. Log in to see your trips.</p>
    <form id="login-form" novalidate>
      <div class="fld"><label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" required></div>
      <div class="fld"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required></div>
      <div id="auth-error" class="err" hidden></div>
      <button type="submit" class="btn btn-primary btn-lg btn-block" id="login-btn">Log in</button>
    </form>
    <p class="alt">New to TravelBeey? <a href="/register">Create an account</a></p>
  </div></div>
</div>
<script src="/js/site.js"></script>
<script src="/js/auth.js"></script>
<script>$('#auth-img').insertAdjacentHTML('afterbegin', img('Allepy Backwaters, Kerala, India.jpg', 1400, ''));</script>
</body></html>
