<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — TravelBeey</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/main.css">
</head>
<body class="auth-page">
<div id="site-preloader" aria-hidden="true">
  <div class="pl-mark"><span>🐝</span> Travel<em>Beey</em></div>
  <div class="pl-bar"></div>
  <div class="pl-pct">FINDING YOUR HIVE…</div>
</div>
<nav id="navbar"><div class="logo"><a href="/" style="text-decoration:none;color:inherit"><span>🐝</span> Travel<em>Beey</em></a></div></nav>
<div class="auth-wrap" data-parallax-layer>
  <div class="auth-orb auth-orb-1 parallax-float" data-depth="18"></div>
  <div class="auth-orb auth-orb-2 parallax-float" data-depth="-14"></div>
  <div class="auth-card" data-tilt data-tilt-strength="4">
    <h2>Welcome Back</h2>
    <p class="auth-sub">Log in to manage your bookings</p>
    <form id="login-form">
      <div class="field"><label>Email</label><input type="email" name="email" required placeholder="your@email.com"></div>
      <div class="field"><label>Password</label><input type="password" name="password" required placeholder="••••••••"></div>
      <div id="auth-error" class="auth-error" style="display:none"></div>
      <button type="submit" class="btn-submit" id="login-btn">Log In</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="/register">Sign up free</a></p>
    <div class="auth-divider">or</div>
    <div class="demo-creds">
      <strong>Demo Admin:</strong> admin@travelbeey.com / Admin@1234
    </div>
  </div>
  <div class="auth-hero">
    <div class="auth-hero-inner">
      <div class="auth-hero-icon parallax-float" data-depth="10">🌊</div>
      <h3>Your next adventure awaits</h3>
      <p>Join 42,000+ happy travellers who've explored the world with TravelBeey.</p>
    </div>
  </div>
</div>
<script src="/js/anim.js" defer></script>
<script src="/js/auth.js"></script>
</body>
</html>
