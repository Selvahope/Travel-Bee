<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css"><title>Create account — TravelBeey</title></head>
<body>
<div id="site-header"></div>
<div class="authwrap">
  <div class="auth-side" id="auth-img"><div><h2>Plan, book and track every trip.</h2>
    <ul><li><svg class="icon" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Track every booking in one place</li><li><svg class="icon" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Book faster with saved details</li><li><svg class="icon" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>Cancel a request any time before confirmation</li></ul></div></div>
  <div class="auth-form"><div class="auth-box">
    <h1>Create account</h1><p>It takes a minute and keeps your bookings together.</p>
    <form id="register-form" novalidate>
      <div class="fld"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required></div>
      <div class="fld"><label for="email">Email</label><input id="email" type="email" name="email" autocomplete="email" required></div>
      <div class="fld"><label for="phone">Phone <span style="font-weight:500;color:var(--muted)">(optional)</span></label><input id="phone" type="tel" name="phone" autocomplete="tel" placeholder="+91 98765 43210"></div>
      <div class="fld"><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="new-password" minlength="6" required><span class="fine">At least 6 characters</span></div>
      <div id="auth-error" class="err" hidden></div>
      <button type="submit" class="btn btn-primary btn-lg btn-block" id="register-btn">Create account</button>
    </form>
    <p class="alt">Already have an account? <a href="/login">Log in</a></p>
  </div></div>
</div>
<script src="/js/site.js"></script>
<script src="/js/auth.js"></script>
<script>$('#auth-img').insertAdjacentHTML('afterbegin', img('Allepy Backwaters, Kerala, India.jpg', 1400, ''));</script>
</body></html>
