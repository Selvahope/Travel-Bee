services:
  - type: web
    name: travel-bee
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # For permanent data on Render, upgrade the plan, attach a disk and uncomment:
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: travelbeey-data
    #   mountPath: /var/data
    #   sizeGB: 1
